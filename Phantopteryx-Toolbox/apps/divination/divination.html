<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divination Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper: #f4ead8;
      --ink: #171717;
      --muted: #606060;
      --line: rgba(0, 0, 0, 0.18);
    }

    html.is-loading::before {
    content: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
    pointer-events: none;
}

    html.is-loading::after {
      content: none;
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      color: var(--ink);
      font: 0.9rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 8%, rgba(139,69,19,0.1), transparent 28rem),
        var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html.is-loading body {
    overflow: hidden;
    visibility: visible;
    opacity: 1;
    transform: none;
    animation: none;
}

    main {
      width: min(620px, 100%);
      display: grid;
      gap: 16px;
      padding: clamp(20px, 4vw, 40px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 252, 242, 0.72);
      box-shadow: 0 18px 48px rgba(65, 47, 30, 0.12);
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      animation: toolIn 720ms ease-out 120ms forwards;
    }

    html.is-loading main {
      visibility: hidden;
      opacity: 0;
      animation: none;
    }

    @keyframes toolIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 7vw, 3.4rem);
      line-height: 1;
      font-weight: 400;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .reading {
      min-height: 8rem;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.42);
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 46px;
      color: var(--ink);
      background: rgba(255,255,255,0.35);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #000;
      color: #fff;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }

      main {
        min-height: calc(100vh - 28px);
        align-content: center;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
    <script src="../../../loading-particle.js"></script>
  <main>
    <h1>Digital Divination Demo</h1>
    <p>This compact version preserves the interaction idea from the original toolbox without carrying the full astrology and I Ching engines inside the portfolio source.</p>
    <div class="reading" id="reading">Ask, then draw a message.</div>
    <div class="actions">
      <button id="draw" type="button">Draw Message</button>
      <button type="button" data-route="../../toolbox.html">Back</button>
    </div>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const fontReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
      const pageReady = document.readyState === "complete" ? Promise.resolve() : new Promise(resolve => window.addEventListener("load", resolve, { once: true }));
      const minimumHold = new Promise(resolve => setTimeout(resolve, 1200));
      const maxHold = new Promise(resolve => setTimeout(resolve, 4200));

      Promise.race([Promise.all([fontReady, pageReady, minimumHold]), maxHold]).then(() => {
        requestAnimationFrame(() => {
          if (window.finishLoadingScreen) {
                        window.finishLoadingScreen();
                    } else {
                        root.classList.remove("is-loading");
                        root.classList.add("is-ready");
                    }
        });
      });
    })();

    const messages = [
      'Begin with the image before naming the pattern.',
      'The tool is strongest when the question is narrow.',
      'Keep the source intact; let each edit become a layer.',
      'A clear interface is also a form of interpretation.'
    ];

    document.getElementById('draw').addEventListener('click', () => {
      const index = Math.floor(Math.random() * messages.length);
      document.getElementById('reading').textContent = messages[index];
    });
  </script>
</body>
</html>
