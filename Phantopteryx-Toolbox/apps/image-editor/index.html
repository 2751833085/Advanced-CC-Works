<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Editor Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #050505;
      --panel: #101010;
      --line: #303030;
      --text: #f4f4f4;
      --muted: #aaa;
      --accent: #f4ead8;
    }

    html.is-loading::before {
    content: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
    pointer-events: none;
}

    html.is-loading::after {
      content: none;
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      color: var(--accent);
      font: 0.9rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(18rem, 24rem) 1fr;
      color: var(--text);
      background: var(--bg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html.is-loading body {
    overflow: hidden;
    visibility: visible;
    opacity: 1;
    transform: none;
    animation: none;
}

    aside,
    main {
      padding: clamp(16px, 2vw, 28px);
      opacity: 0;
      transform: translateY(18px);
      animation: toolIn 720ms ease-out 120ms forwards;
    }

    html.is-loading aside,
    html.is-loading main {
      visibility: hidden;
      opacity: 0;
      animation: none;
    }

    @keyframes toolIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    aside {
      display: grid;
      align-content: start;
      gap: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.4rem, 4vw, 3rem);
      line-height: 1;
      font-weight: 400;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      accent-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 44px;
      color: var(--text);
      background: #141414;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: var(--accent);
      color: #000;
    }

    main {
      display: grid;
      place-items: center;
      background:
        linear-gradient(45deg, #111 25%, transparent 25%),
        linear-gradient(-45deg, #111 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #111 75%),
        linear-gradient(-45deg, transparent 75%, #111 75%),
        #151515;
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    .stage {
      width: min(900px, 100%);
      min-height: min(70vh, 680px);
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 5, 5, 0.65);
    }

    img {
      max-width: 86%;
      max-height: 74vh;
      object-fit: contain;
      filter: brightness(var(--brightness, 1)) contrast(var(--contrast, 1)) saturate(var(--saturation, 1));
    }

    .empty {
      margin: 0;
      color: #777;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .actions {
        grid-template-columns: 1fr;
      }

      main {
        min-height: 58vh;
      }

      .stage {
        min-height: 52vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      aside,
      main {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
    <script src="../../../loading-particle.js"></script>
  <aside>
    <h1>Image Editor Demo</h1>
    <p class="hint">Open an image and test a compact set of browser-native adjustments.</p>
    <div class="controls">
      <label>Open image <input id="file" type="file" accept="image/*"></label>
      <label>Brightness <input data-filter="brightness" type="range" min="50" max="150" value="100"></label>
      <label>Contrast <input data-filter="contrast" type="range" min="50" max="150" value="100"></label>
      <label>Saturation <input data-filter="saturation" type="range" min="0" max="200" value="100"></label>
    </div>
    <div class="actions">
      <button id="reset" type="button">Reset</button>
      <button type="button" data-route="../../toolbox.html">Back</button>
    </div>
  </aside>
  <main>
    <div class="stage">
      <p class="empty" id="empty">Open an image to preview edits.</p>
      <img id="preview" alt="Edited preview" hidden>
    </div>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const fontReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
      const pageReady = document.readyState === "complete" ? Promise.resolve() : new Promise(resolve => window.addEventListener("load", resolve, { once: true }));
      const minimumHold = new Promise(resolve => setTimeout(resolve, 1200));
      const maxHold = new Promise(resolve => setTimeout(resolve, 4200));

      Promise.race([Promise.all([fontReady, pageReady, minimumHold]), maxHold]).then(() => {
        requestAnimationFrame(() => {
          if (window.finishLoadingScreen) {
                        window.finishLoadingScreen();
                    } else {
                        root.classList.remove("is-loading");
                        root.classList.add("is-ready");
                    }
        });
      });
    })();

    const preview = document.getElementById('preview');
    const empty = document.getElementById('empty');
    const controls = document.querySelectorAll('[data-filter]');

    document.getElementById('file').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      empty.hidden = true;
    });

    controls.forEach(control => {
      control.addEventListener('input', () => {
        document.documentElement.style.setProperty(`--${control.dataset.filter}`, control.value / 100);
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      controls.forEach(control => {
        control.value = 100;
        document.documentElement.style.setProperty(`--${control.dataset.filter}`, 1);
      });
    });
  </script>
</body>
</html>
